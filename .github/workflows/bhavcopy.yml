name: NSE Bhavcopy to Sheet

on:
  schedule:
    # GitHub cron is always UTC.  IST = UTC + 5:30
    - cron: "17 14 * * 1-5"  # 19:47 IST Mon-Fri
    - cron: "47 15 * * 1-5"  # 21:17 IST Mon-Fri (retry)
    - cron: "13 2 * * 2-6"   # 07:43 IST Tue-Sat (backup: loads previous trading day if evening runs were late/skipped)
  workflow_dispatch:
    inputs:
      date:
        description: "Single date DD-MM-YYYY (leave blank for today)"
        required: false
        default: ""
      from_date:
        description: "Backfill FROM DD-MM-YYYY"
        required: false
        default: ""
      to_date:
        description: "Backfill TO DD-MM-YYYY"
        required: false
        default: ""
      refresh_securities:
        description: "Force refresh of securities list (company name / listing date / ISIN)"
        type: boolean
        required: false
        default: false

concurrency:
  group: bhavcopy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Fetch bhavcopy and push to Sheet
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_FROM: ${{ github.event.inputs.from_date }}
          INPUT_TO: ${{ github.event.inputs.to_date }}
          INPUT_REFRESH_SEC: ${{ github.event.inputs.refresh_securities }}
          EVENT_NAME: ${{ github.event_name }}
        run: python fetch_bhavcopy.py
